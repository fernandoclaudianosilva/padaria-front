{% load static %}
<div class="location-card" id="{{ location.slug }}" style="border:1px solid var(--border); background:var(--warm-white);" data-reveal>
    <div style="aspect-ratio:4/3; overflow:hidden; background:var(--cream);">
        {% if location.image %}
            <img src="{{ location.image.url }}" alt="{{ location.name }}" style="width:100%; height:100%; object-fit:cover;">
        {% else %}
            <img src="{% static 'images/placeholder-location.svg' %}" alt="{{ location.name }}" style="width:100%; height:100%; object-fit:cover;">
        {% endif %}
    </div>
    <div style="padding:26px;">
        <h3 style="margin-bottom:10px;">{{ location.name }}</h3>
        <p class="muted" style="margin-bottom:4px;">{{ location.address_line }}</p>
        <p class="muted" style="margin-bottom:16px;">{{ location.city }}, {{ location.state }} {{ location.zip_code }}</p>
        <p style="margin-bottom:16px;"><strong>{{ location.phone }}</strong></p>
        <p class="muted" style="white-space:pre-line; font-size:0.85rem; margin-bottom:22px;">{{ location.hours }}</p>
        <a class="btn btn--small"
           href="https://www.google.com/maps/search/?api=1&query={{ location.address_line|urlencode }}+{{ location.city|urlencode }}+{{ location.state }}"
           target="_blank" rel="noopener">Get Directions</a>
    </div>
</div>
