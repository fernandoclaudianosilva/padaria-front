{% load static %}
<a href="{{ product.get_absolute_url }}" class="product-card" data-reveal>
    <div class="product-card-media">
        {% if product.image %}
            <img src="{{ product.image.url }}" alt="{{ product.name }}" loading="lazy">
        {% else %}
            <img src="{% static 'images/placeholder-product.svg' %}" alt="{{ product.name }}" loading="lazy">
        {% endif %}
    </div>
    <h3>{{ product.name }}</h3>
    <p class="desc">{{ product.short_description|default:product.category.name }}</p>
    <p class="price">${{ product.price }}</p>
    <span class="view-link">View Product</span>
</a>
